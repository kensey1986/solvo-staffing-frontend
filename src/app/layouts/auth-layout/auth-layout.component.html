<div class="auth-layout">
  <div class="auth-layout__background">
    <div class="auth-layout__gradient"></div>
  </div>

  <!-- Theme Toggle & Language Switcher -->
  <div class="auth-layout__theme-toggle">
    <app-language-switcher />
    <app-theme-toggle />
  </div>

  <main class="auth-layout__main">
    <div class="auth-layout__branding">
      <img
        src="assets/logo/SolvoLogo-2025.svg"
        alt="Solvo Global Logo"
        class="auth-layout__logo"
        width="180"
        height="50"
      />
      <h1 class="auth-layout__tagline">{{ 'AUTH.TAGLINE' | translate }}</h1>
    </div>

    <div class="auth-layout__content">
      <router-outlet />
    </div>
  </main>

  <footer class="auth-layout__footer">
    <p class="auth-layout__copyright">
      &copy; {{ currentYear }} {{ 'AUTH.COPYRIGHT' | translate }}
    </p>
  </footer>
</div>
